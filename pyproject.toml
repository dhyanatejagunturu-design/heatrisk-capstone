[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatrisk"
version = "0.1.0"
description = "Heat-related mortality and urban heat vulnerability in five European countries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Dhyana Teja Gunturu" },
  { name = "Sai Vamshi Pakala" },
]
# Full environment lives in environment.yml (conda-forge).
# Listed here: only what the package itself needs to import and be tested.
dependencies = ["numpy", "pandas", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
