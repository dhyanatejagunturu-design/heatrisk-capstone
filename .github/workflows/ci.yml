name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: pip install -e ".[test]" ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
